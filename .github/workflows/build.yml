name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v5
      with:
        java-version: '11'
        distribution: 'temurin'
        # تم إزالة سطر cache: gradle لتجنب فشل البناء إذا تغير مسار الملفات

    - name: Find Project Root and Build APK
      run: |
        # البحث عن مكان ملف gradlew تلقائياً والدخول إلى مجلده
        GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "Error: gradlew file not found! Make sure you extracted the zip file before uploading."
          exit 1
        fi
        PROJECT_DIR=$(dirname "$GRADLEW_PATH")
        echo "Building project in directory: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload Compiled APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: "**/*.apk"
